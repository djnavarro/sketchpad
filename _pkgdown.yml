url: https://sketchpad.djnavarro.net/
template:
  package: waeponwifestre

reference:
- title: Core structure
  desc: >
    The classes and generics that define how a sketch is built and
    rendered, independent of any specific drawable.
  contents:
  - sketch
  - canvas
  - drawable
  - draw
  - xy
  - style

- title: Two-dimensional shapes
  desc: >
    Closed, fillable `drawable`s (`geometry = "polygon"`).
  contents:
  - starts_with("shape_")

- title: One-dimensional curves
  desc: >
    Open, stroked `drawable`s (`geometry = "path"`).
  contents:
  - starts_with("curve_")

- title: Zero-dimensional points
  desc: >
    Unconnected marker `drawable`s (`geometry = "points"`).
  contents:
  - starts_with("points_")

- title: Noise tools
  desc: >
    Scalar noise fields used to distort a shape's points, used by
    `shape_blob()`/`shape_ribbon()`/`shape_twist()`.
  contents:
  - starts_with("noise_")

- title: Fill tools
  desc: >
    Textures and patterns for `style()`'s `fill` argument, used by 2D
    shapes.
  contents:
  - starts_with("fill_")

- title: Transformation tools
  desc: >
    Transformations applied to a `drawable`'s computed `points`,
    used by every `drawable`'s `trans` property.
  contents:
  - trans
  - starts_with("trans_")

- title: Effects tools
  desc: >
    Helpers that compose several drawables together for a particular
    visual effect, rather than constructing a single drawable.
  contents:
  - starts_with("effect_")

- title: Palette tools
  desc: >
    Functions returning a plain character vector of colours, for use in
    `style()`'s `color`/`fill` arguments or any `fill_*()` helper's own
    colour vector.
  contents:
  - starts_with("palette_")

